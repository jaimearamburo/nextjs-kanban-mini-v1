name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces. Runs on `main`
# always finish, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast feedback: these need no database.
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Includes the typedRoutes types from `next typegen`.
      - run: pnpm typecheck

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway Postgres for this run only. CI never connects to the dev or
    # production databases and needs no database secret (ADR-0006).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `dev` and `test` are the same throwaway database here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanban_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_ci
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanban_ci
      # The guards refuse to run without a production host to rule out. CI can't
      # reach production anyway, so any host that isn't localhost will do.
      PRODUCTION_DATABASE_HOST: production.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:test:migrate
      # The build prerenders the Board's static shell, which reads the database.
      - run: pnpm build
      - name: Integration tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Seeds the database, makes its own test build and starts it (see
      # playwright.config.ts).
      - name: Playwright tests
        id: e2e
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
